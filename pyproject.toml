[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-computer-use"
version = "2.0.0"
description = "Antigravity Native Desktop Computer-Use, UIA + Set-of-Marks (SoM) Grounding, and RFC 6962 Visual Action Safety Oracle."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "orakulzero", email = "129319184+orakulzero@users.noreply.github.com"}
]
keywords = ["antigravity", "computer-use", "som", "uia", "win32", "mcp", "merkle-audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
agy-computer-use = "agy_computer_use.cli:main"
agy-computer-use-mcp = "agy_computer_use.mcp_server:run_stdio_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
